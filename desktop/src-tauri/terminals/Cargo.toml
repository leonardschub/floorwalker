[package]
name = "terminals"
version = "0.1.0"
edition = "2021"
description = "Session terminals (ADR-0015): runs `claude attach` under PTYs the app owns, keeps each attach's grid and paints the PC image. No Tauri or Bevy types."

[dependencies]
# Only for the Claude Code variables every `claude` the app runs goes without.
agents = { path = "../agents" }
alacritty_terminal = { version = "0.26", default-features = false }
swash = "0.2"
libc = "0.2"
# Reads Claude Code's session files, to attach only to sessions whose process runs.
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# Saves PC images as PNGs (the attach probe's `paint`).
png = "0.18"
